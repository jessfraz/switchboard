[package]
name = "phone-cli"
description = "Local, permission-scoped phone calls with private encrypted transcripts"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
version.workspace = true
publish = false

[lib]
name = "phone_cli"

[[bin]]
name = "phone"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
clap.workspace = true
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[lints]
workspace = true
