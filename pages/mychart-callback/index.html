<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finish MyChart login</title>
    <link rel="stylesheet" href="../_shared/callback-page.css">
  </head>
  <body>
    <main id="app"></main>
    <script id="page-config" type="application/json">
      {
        "title": "Finish MyChart login",
        "storageKey": "mychart_callback_url",
        "fieldLabel": "Login code",
        "leadInitialHtml": "The terminal running <code>mychart login ucla</code> should finish automatically. If it does not, copy the login code below.",
        "leadNoCallbackHtml": "Open this page through the OAuth redirect. There is nothing to copy yet.",
        "leadReadyHtml": "The terminal running <code>mychart login ucla</code> should finish automatically. If it does not, copy the login code.",
        "leadErrorHtml": "Epic returned an OAuth error instead of an authorization code. Copy the payload and paste it into the waiting terminal.",
        "leadIncompleteHtml": "The redirect landed here but is missing the expected code and state parameters.",
        "copyButtonLabel": "Copy code",
        "copyButtonLabelError": "Copy error payload",
        "copyButtonLabelIncomplete": "Copy callback payload",
        "commandButtonLabel": "Copy fallback command",
        "commandPrefix": "mychart finish",
        "primaryValueMode": "payload",
        "commandValueMode": "primary_value_or_callback_url",
        "preferCodeOnly": true,
        "localBridge": {
          "statusLabel": "Sent to CLI",
          "urls": ["http://127.0.0.1:8911/mychart-callback"]
        },
        "payloadKeys": ["code", "state", "error", "error_description"],
        "readyParams": ["code", "state"],
        "placeholder": "Waiting for OAuth redirect...",
        "theme": {
          "blue": "#4a5ced",
          "blueLight": "#e8eafd",
          "blueDark": "#3d4fd4",
          "pageWidth": "520px",
          "fieldMinHeight": "4rem"
        }
      }
    </script>
    <script src="../_shared/callback-page.js"></script>
  </body>
</html>
