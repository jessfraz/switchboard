<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finish Schwab login</title>
    <link rel="stylesheet" href="../_shared/callback-page.css">
  </head>
  <body>
    <main id="app"></main>
    <script id="page-config" type="application/json">
      {
        "title": "Finish Schwab login",
        "storageKey": "schwab_callback_url",

        "commandButtonLabel": "Copy exchange command",

        "primaryValueMode": "callback_url",
        "commandValueMode": "callback_url",
        "payloadKeys": [],
        "readyParams": ["code"],
        "placeholder": "Waiting for OAuth redirect...",
        "theme": {
          "blue": "#2d5d88",
          "blueLight": "#e6eff6",
          "blueDark": "#244d71",
          "pageWidth": "560px",
          "fieldMinHeight": "6rem"
