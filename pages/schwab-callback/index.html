<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finish Schwab login</title>
    <link rel="stylesheet" href="../_shared/callback-page.css">
  </head>
  <body>
    <main id="app"></main>
    <script id="page-config" type="application/json">
      {
        "title": "Finish Schwab login",
        "storageKey": "schwab_callback_url",
        "fieldLabel": "Login code",
        "leadInitialHtml": "Copy the login code below, paste it into the terminal waiting on <code>schwab auth login</code>, and move on with your life.",
        "leadNoCallbackHtml": "Open this page through the OAuth redirect. There is nothing to copy yet.",
        "leadReadyHtml": "Copy the login code and paste it into the terminal where <code>schwab auth login</code> is waiting.",
        "leadErrorHtml": "Schwab returned an OAuth error instead of an authorization code. Copy the payload and paste it into the waiting terminal.",
        "leadIncompleteHtml": "The redirect landed here but is missing the expected code and state parameters.",
        "copyButtonLabel": "Copy code",
        "copyButtonLabelError": "Copy error payload",
        "copyButtonLabelIncomplete": "Copy callback payload",
        "commandButtonLabel": "Copy fallback command",
        "commandPrefix": "schwab auth exchange-url",
        "primaryValueMode": "payload",
        "commandValueMode": "primary_value_or_callback_url",
        "preferCodeOnly": true,
        "payloadKeys": ["code", "state", "error", "error_description", "session"],
        "readyParams": ["code", "state"],
        "placeholder": "Waiting for OAuth redirect...",
        "theme": {
          "blue": "#2d5d88",
          "blueLight": "#e6eff6",
          "blueDark": "#244d71",
          "pageWidth": "560px",
          "fieldMinHeight": "6rem"
        }
      }
    </script>
    <script src="../_shared/callback-page.js"></script>
  </body>
</html>
