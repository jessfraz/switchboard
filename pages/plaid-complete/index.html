<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plaid Link Complete</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #113831;
        --accent: #0f7b6c;
        --accent-light: #e3f4ef;
        --surface: #f7fbfa;
        --edge: #c9e4dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 16px/1.5 "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(15, 123, 108, 0.16), transparent 34%),
          linear-gradient(180deg, #ffffff 0%, var(--surface) 100%);
      }

      main {
        width: min(100%, 540px);
        border: 1px solid var(--edge);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        padding: 32px 28px;
        box-shadow: 0 18px 50px rgba(17, 56, 49, 0.08);
      }

      .pill {
        display: inline-block;
        margin-bottom: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--accent-light);
        color: var(--accent);
        font: 600 12px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 2.6rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 14px;
      }

      code {
        font: 600 0.95em/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace;
        background: var(--accent-light);
        padding: 0.1em 0.35em;
        border-radius: 0.4em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="pill">Plaid Hosted Link</div>
      <h1>Browser step finished.</h1>
      <p>Go back to the terminal running <code>plaid auth login</code>.</p>
      <p>If that terminal is gone, run <code>plaid auth finish</code> in this repo to complete token exchange.</p>
    </main>
  </body>
</html>
