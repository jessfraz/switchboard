[workspace]
members = [
  "crates/switchboard-cli",
  "crates/switchboard-core",
  "crates/switchboard-providers",
  "crates/switchboard-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.76"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
