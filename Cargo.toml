[workspace]
members = [
    "crates/mychart-cli",
    "crates/mindbody-cli",
    "crates/momence-cli",
    "crates/switchboard-cli",
    "crates/switchboard-core",
    "crates/switchboard-providers",
    "crates/switchboard-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.76"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.0", features = ["derive", "env"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
toml = "1.1.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
