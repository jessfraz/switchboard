[workspace]
members = [
    "crates/mindbody-cli",
    "crates/momence-cli",
    "crates/mychart-cli",
    "crates/plaid-cli",
    "crates/schwab-cli",
    "crates/switchboard-cli",
    "crates/switchboard-core",
    "crates/switchboard-providers",
    "crates/switchboard-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
homepage = "https://jessfraz.github.io/switchboard/"
license = "MIT"
repository = "https://github.com/jessfraz/switchboard"
rust-version = "1.76"
version = "0.1.0"
documentation = "https://jessfraz.github.io/switchboard/"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
quick-xml = "0.41.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rsa = { version = "0.9.10", features = ["pem", "sha2"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.17"
toml = "1.1.2"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
