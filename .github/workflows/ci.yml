name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  phone-worker:
    name: Phone Worker Checks (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/livekit-phone
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src tests
      - run: uv run --locked --no-sync pytest -q
      - run: uv run --locked --no-sync livekit-phone-worker check

  windows-process:
    name: Windows Process Checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test bounded process capture
        run: cargo test -p switchboard-core process::tests

  rust:
    name: Rust Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install GitHub CLI
        run: |
          gh_version=2.93.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
            -o /tmp/gh.tar.gz
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo install "/tmp/gh_${gh_version}_linux_amd64/bin/gh" /usr/local/bin/gh

      - name: Install Google Workspace CLI
        run: cargo install --version 0.22.5 --locked google-workspace-cli --bin gws

      - name: Build MyChart CLI
        run: cargo build -p mychart-cli

      - name: Build Schwab CLI
        run: cargo build -p schwab-cli

      - name: Build Phone CLI
        run: cargo build -p phone-cli

      - name: Expose workspace binaries on PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Smoke Check Installed CLIs
        run: |
          gh --version
          gws --version
          mychart --version
          schwab --version
          phone --version

      - name: Check Generated CLI Inventories
        run: cargo run -p switchboard-providers --bin switchboard-catalog-gen -- check

      - name: Check Generated Docs
        run: cargo run -p switchboard-cli --bin switchboard-docs-gen -- check

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all --all-features --benches --tests --examples

      - name: Test
        run: cargo test --workspace --all-features

      - name: Bench Build
        run: cargo bench --workspace --all-features --no-run
