name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    env:
      SWITCHBOARD_RUN_REAL_CLI_SMOKE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install GitHub CLI
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Install Google Workspace CLI
        run: cargo install --locked google-workspace-cli --bin gws

      - name: Smoke Check Installed CLIs
        run: |
          gh --version
          gws --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all --all-features --benches --tests --examples

      - name: Test
        run: cargo test --workspace --all-features

      - name: Bench Build
        run: cargo bench --workspace --all-features --no-run
