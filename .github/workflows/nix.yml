name: Test Nix Flake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix flake check for all platforms
        run: |
          nix flake check --all-systems

  nix-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix build packaged CLIs for Linux
        run: |
          nix build \
            .#switchboard \
            .#mychart \
            .#mindbody \
            .#messages \
            .#momence \
            .#phone

      - name: Smoke check packaged phone CLI and worker source
        run: |
          phone_package=$(nix path-info .#phone)
          "$phone_package/bin/phone" --version
          test -f "$phone_package/share/phone/livekit-worker/pyproject.toml"
          test -f "$phone_package/share/phone/livekit-worker/uv.lock"
          "$phone_package/share/phone/python" --version

      - name: Smoke check packaged Messages CLI
        run: |
          messages_package=$(nix path-info .#messages)
          "$messages_package/bin/messages" --version
          "$messages_package/bin/messages" --help

  nix-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: nix build packaged CLIs for macOS
        run: |
          nix build \
            .#switchboard \
            .#mychart \
            .#mindbody \
            .#messages \
            .#momence \
            .#phone

      - name: Smoke check packaged Messages CLI
        run: |
          messages_package=$(nix path-info .#messages)
          "$messages_package/bin/messages" --version
          "$messages_package/bin/messages" --help

      - name: Smoke check packaged phone CLI and worker source
        run: |
          phone_package=$(nix path-info .#phone)
          "$phone_package/bin/phone" --version
          test -f "$phone_package/share/phone/livekit-worker/pyproject.toml"
          test -f "$phone_package/share/phone/livekit-worker/uv.lock"
          "$phone_package/share/phone/python" --version
