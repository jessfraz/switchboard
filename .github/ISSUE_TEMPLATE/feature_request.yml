name: Feature request
description: Propose a new capability or workflow.
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is broken, missing, or too painful today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed shape
      description: Describe the tool, provider, or docs behavior you want.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Include examples, competing tools, or reference docs if useful.
